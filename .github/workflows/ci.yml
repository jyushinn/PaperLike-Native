name: macOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Public file checks
        run: python3 Tools/check-public-files.py
      - name: Toolchain
        run: |
          swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Tests
        run: Tools/test.sh
      - name: Release tooling regression check
        run: zsh Tools/test-release-tools.sh
      - name: Release build (ad-hoc, no notarization)
        run: Tools/build-app.sh release
